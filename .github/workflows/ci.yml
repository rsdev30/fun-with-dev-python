name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the shared project in editable mode so Flask project can import it
          pip install -e fun-with-dev-python-shared
          # Install Flask project's requirements if present
          if [ -f fun-with-dev-python-flask/requirements.txt ]; then pip install -r fun-with-dev-python-flask/requirements.txt; fi
          # Install test tools
          pip install pytest hypothesis

      - name: Run tests
        run: pytest
