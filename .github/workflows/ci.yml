name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install core and dev requirements
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # Ensure editable installs as a fallback
          pip install -e fun-with-dev-python-shared || true
          pip install -e fun-with-dev-python-flask || true
          # Install Flask project's requirements if present
          if [ -f fun-with-dev-python-flask/requirements.txt ]; then pip install -r fun-with-dev-python-flask/requirements.txt; fi
          # Show installed packages and import diagnostics for debugging
          pip list
          python - <<'PY'
import sys, importlib, importlib.util
print('PYTHONPATH:', sys.path)
print('Fun_With_Dev_Flask spec:', importlib.util.find_spec('Fun_With_Dev_Flask'))
print('fun_with_dev_python_shared spec:', importlib.util.find_spec('fun_with_dev_python_shared'))
try:
    import Fun_With_Dev_Flask
    print('Fun_With_Dev_Flask __file__=', Fun_With_Dev_Flask.__file__)
except Exception as e:
    print('Fun_With_Dev_Flask import error:', e)
try:
    import fun_with_dev_python_shared
    print('fun_with_dev_python_shared __file__=', fun_with_dev_python_shared.__file__)
except Exception as e:
    print('fun_with_dev_python_shared import error:', e)
PY

      - name: Run tests
        run: pytest
