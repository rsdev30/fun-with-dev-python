name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install core and dev requirements
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # Ensure editable installs as a fallback
          pip install -e fun-with-dev-python-shared || true
          pip install -e fun-with-dev-python-flask || true
          # Install Flask project's requirements if present
          if [ -f fun-with-dev-python-flask/requirements.txt ]; then pip install -r fun-with-dev-python-flask/requirements.txt; fi
          # Show installed packages and import diagnostics for debugging
          pip list
          python .github/scripts/import_diag.py

      - name: Run tests
        run: pytest
